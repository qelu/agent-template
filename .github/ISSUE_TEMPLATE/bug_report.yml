name: Bug report
description: Report reproducible behavior that does not match the documented contract.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Agent Template. Do not include credentials, private data, or undisclosed vulnerabilities.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not an undisclosed security vulnerability; those are reported through the Security tab.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide a release tag or commit SHA.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - portable
        - Codex
        - Claude Code
        - Gemini CLI
        - source repository
        - other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime adapter
      placeholder: none or reference
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe sequence that reproduces the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python version, operating system, and relevant dependency versions.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, credentials, personal paths, and private data.
      render: shell
