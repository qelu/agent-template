[project]
name = "__AGENT_ID__"
version = "0.1.0"
description = "Reusable governed AI agent template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
