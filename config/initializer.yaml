version: "1.0"
required_capabilities:
  - task-planning
  - safe-tool-use
  - manage-project-scope
  - map-skill-command
  - skill-auditor
  - import-external-skill
  - import-template-skills
default_capabilities:
  - evidence-gathering
  - documentation-maintenance
  - devoteam-branding
bundles:
  governance:
    description: Evidence, dependency, documentation, and post-work governance reviews.
    capabilities:
      - evidence-gathering
      - dependency-change-review
      - documentation-maintenance
      - post-work-review
    integrations: []
  operations:
    description: Incident procedures, integration lifecycle guidance, and staged secret scanning.
    capabilities:
      - incident-triage
      - incident-response
      - integration-lifecycle
      - pre-commit-secret-scan
    integrations: []
  team-baseline:
    description: All provider-neutral optional governance and operations additions.
    capabilities:
      - evidence-gathering
      - dependency-change-review
      - documentation-maintenance
      - post-work-review
      - incident-triage
      - incident-response
      - integration-lifecycle
      - pre-commit-secret-scan
    integrations: []
  atlassian-work:
    description: Atlassian Rovo MCP plus integration lifecycle and post-work review guidance.
    capabilities:
      - integration-lifecycle
      - post-work-review
    integrations:
      - atlassian-rovo
  github-work:
    description: GitHub MCP plus evidence and integration lifecycle guidance.
    capabilities:
      - evidence-gathering
      - integration-lifecycle
    integrations:
      - github
  google-workspace:
    description: Pinned gws CLI plus its operating skill and integration lifecycle guidance.
    capabilities:
      - google-workspace-cli
      - integration-lifecycle
    integrations:
      - google-workspace
defaults:
  host: claude-code
  python: "3.13"
  development_tools: true
  security_tools: false
