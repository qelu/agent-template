version: "1.0"
capabilities:
  - id: task-planning
    type: skill
    status: active
    path: skills/task-planning
    description: Plan bounded work with explicit scope, validation, and rollback.
    when: Use for multi-step work or any request that changes state beyond a trivial edit.

  - id: evidence-gathering
    type: skill
    status: active
    path: skills/evidence-gathering
    description: Verify material claims using direct observation and primary evidence.
    when: Use when conclusions depend on repository inspection, research, or current facts.

  - id: safe-tool-use
    type: skill
    status: active
    path: skills/safe-tool-use
    description: Apply tools within scope, least privilege, and approval boundaries.
    when: Use before executing tools that can change state or cross a trust boundary.

  - id: documentation-maintenance
    type: skill
    status: active
    path: skills/documentation-maintenance
    description: Maintain durable decisions and operational documentation without duplication.
    when: Use when behavior or architecture changes require durable project documentation.
