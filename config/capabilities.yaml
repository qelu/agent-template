version: "1.0"
capabilities:
  - id: task-planning
    type: skill
    status: active
    path: skills/task-planning
    description: Plan bounded work with explicit scope, validation, and rollback.
    when: Use for multi-step work or any request that changes state beyond a trivial edit.

  - id: evidence-gathering
    type: skill
    status: active
    path: skills/evidence-gathering
    description: Verify material claims using direct observation and primary evidence.
    when: Use when conclusions depend on repository inspection, research, or current facts.

  - id: safe-tool-use
    type: skill
    status: active
    path: skills/safe-tool-use
    description: Apply tools within scope, least privilege, and approval boundaries.
    when: Use before executing tools that can change state or cross a trust boundary.

  - id: manage-project-scope
    type: skill
    status: active
    path: skills/manage-project-scope
    description: Add project folders to the harness's portable read or read-write policy scope.
    when: Use when a user wants the harness to access another folder or repository.

  - id: map-skill-command
    type: skill
    status: active
    path: skills/map-skill-command
    description: Create project-level slash-command aliases for installed harness skills.
    when: Use when a user wants to map a slash command to an installed skill.

  - id: skill-auditor
    type: skill
    status: active
    path: skills/skill-auditor
    description: Statically audit skills for safety, validity, dependencies, and portability.
    when: Use before importing a skill or when reviewing a skill folder or ZIP.

  - id: import-external-skill
    type: skill
    status: active
    path: skills/import-external-skill
    description: Safely audit and import a new skill from an immutable external source.
    when: Use when a user explicitly asks to import a skill from a folder, ZIP, pinned URL, or pinned Git source.

  - id: import-template-skills
    type: skill
    status: active
    path: skills/import-template-skills
    description: Import only new skills from a stable tagged agent-template release.
    when: Use when a user explicitly asks to check for or import skills added to a tagged template release.

  - id: documentation-maintenance
    type: skill
    status: active
    path: skills/documentation-maintenance
    description: Maintain durable decisions and operational documentation without duplication.
    when: Use when behavior or architecture changes require durable project documentation.

  - id: devoteam-branding
    type: skill
    status: active
    path: skills/devoteam-branding
    description: Apply and validate Devoteam branding across business artifacts.
    when: Use when creating, rebranding, or auditing a Devoteam document, presentation, spreadsheet, PDF, CV, report, proposal, or visual asset.
