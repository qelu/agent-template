{
  "version": "1.0",
  "actions": {
    "read": "allow",
    "write": "ask",
    "delete": "deny",
    "external_side_effect": "ask",
    "unknown": "ask"
  },
  "scope": {
    "allowed_read_paths": ["."],
    "allowed_write_paths": ["."],
    "denied_paths": [
      ".env",
      ".env.*",
      ".ssh",
      ".ssh/**",
      "credentials",
      "credentials/**",
      "secrets",
      "secrets/**"
    ]
  },
  "mcp": {
    "mode": "allowlist",
    "allowed_servers": []
  },
  "shell": {
    "denied_patterns": ["rm -rf /", "mkfs", ":(){ :|:& };:"]
  },
  "audit": {
    "enabled": true
  }
}
