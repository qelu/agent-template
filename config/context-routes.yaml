version: "1.0"
routes:
  planning:
    match_patterns: ["plan", "roadmap", "break down"]
    paths: ["skills/task-planning/SKILL.md"]
  research:
    match_patterns: ["research", "verify", "source", "evidence"]
    paths: ["skills/evidence-gathering/SKILL.md"]
  change:
    match_patterns: ["change", "create", "edit", "delete", "deploy"]
    paths: ["skills/safe-tool-use/SKILL.md", "config/policies.yaml"]
  documentation:
    match_patterns: ["document", "runbook", "decision", "adr"]
    paths:
      - "skills/documentation-maintenance/SKILL.md"
      - "templates/adr-template.md"
      - "templates/runbook-template.md"
